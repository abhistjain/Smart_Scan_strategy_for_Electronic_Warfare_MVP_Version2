[project]
name = "smart-scan-ew-backend"
version = "0.1.0"
description = "ML-based Electronic Support (ES) receiver scheduler - SIH26055 Smart Scan Strategy for Electronic Warfare"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
    "huggingface_hub>=0.23",
    "pyarrow>=15.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sim", "algo", "metrics", "api", "data", "classification", "ai_analyst"]
